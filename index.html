<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euge — Portfolio</title>
<meta name="description" content="Portfolio de Euge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --amarillo:#FFC400;
    --rojo:#E8402A;
    --negro:#17140F;
    --crema:#FFF8EC;
    --gris:#5B5648;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--crema);
    color:var(--negro);
    line-height:1.6;
  }
  h1,h2{font-family:'Poppins', sans-serif;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  header{
    padding:80px 0 40px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; top:-120px; right:-120px;
    width:360px; height:360px; border-radius:50%;
    background:var(--amarillo);
    opacity:.35; filter:blur(10px);
  }
  header h1{
    position:relative; z-index:1;
    font-size:clamp(2rem, 5vw, 3rem);
    font-weight:800; letter-spacing:-1px;
  }
  header h1 span{
    background:linear-gradient(90deg, var(--rojo), var(--amarillo));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* VIDEO */
  .video-section{padding:20px 0 70px;}
  .video-frame{
    max-width:720px; margin:0 auto;
    border-radius:24px; overflow:hidden;
    border:5px solid var(--negro);
    box-shadow:10px 10px 0 var(--amarillo);
  }
  video{width:100%; display:block; background:#000;}

  /* BIO */
  .bio-section{padding:20px 0 90px;}
  .bio-section h2{
    font-size:1.6rem; margin-bottom:20px; text-align:center;
  }
  .bio-box{
    background:#fff;
    border:2px dashed rgba(23,20,15,0.25);
    border-radius:20px;
    padding:36px;
    max-width:680px; margin:0 auto;
    font-size:1.05rem;
    color:var(--gris);
  }
  .bio-box p{margin-bottom:0;}
  .bio-box .placeholder{
    font-style:italic;
  }

  footer{
    text-align:center; padding:28px 0; font-size:0.85rem; color:var(--gris);
  }

  @media (max-width:600px){
    .bio-box{padding:24px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1><span>Euge</span></h1>
  </div>
</header>

<section class="video-section" id="video">
  <div class="wrap">
    <div class="video-frame">
      <video controls preload="metadata">
        <source src="videos/presentacion.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
      </video>
    </div>
  </div>
</section>

<section class="bio-section" id="bio">
  <div class="wrap">
    <h2>Sobre mí</h2>
    <div class="bio-box">
      <!-- EDITÁ ACÁ: reemplazá este texto por tu bio de experiencia en publicidad digital -->
      <p class="placeholder">[ Escribí acá tu bio: tu experiencia en publicidad digital ]</p>
    </div>
  </div>
</section>

<footer>
  © 2026 Euge
</footer>

</body>
</html>
